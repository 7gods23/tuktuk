<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuktuk - Ride Anywhere</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <header class="bg-white shadow p-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-blue-600">Tuktuk</h1>
      <nav>
        <a href="#" class="text-gray-700 hover:text-blue-500 px-2">Home</a>
        <a href="#driver" class="text-gray-700 hover:text-blue-500 px-2">Become a Driver</a>
        <a href="#contact" class="text-gray-700 hover:text-blue-500 px-2">Contact</a>
      </nav>
    </header>

    <section class="text-center py-20 bg-gradient-to-r from-blue-500 to-indigo-600 text-white">
      <h2 class="text-4xl font-extrabold mb-4">Book a Ride in Seconds</h2>
      <p class="text-lg mb-6">Tuktuk brings fast, affordable rides to your city.</p>
      <a href="#" class="bg-white text-blue-600 font-semibold py-3 px-6 rounded-full shadow hover:bg-gray-100">Book a Ride</a>
    </section>

    <section id="driver" class="py-20 px-6 md:px-20 text-center">
      <h3 class="text-3xl font-bold mb-4">Drive with Tuktuk</h3>
      <p class="mb-6 text-gray-700">Join thousands of drivers earning on their own schedule.</p>
      <a href="#" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Become a Driver</a>
    </section>

    <section id="contact" class="bg-gray-100 py-16 px-6 md:px-20">
      <h4 class="text-2xl font-bold mb-4 text-center">Stay in the Loop</h4>
      <form class="max-w-xl mx-auto flex flex-col gap-4">
        <input type="email" placeholder="Enter your email" class="p-3 rounded border border-gray-300" required />
        <button type="submit" class="bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Subscribe</button>
      </form>
    </section>

    <footer class="text-center py-6 text-sm text-gray-500">
      &copy; 2025 Tuktuk. All rights reserved.
    </footer>
  </body>
</html>
